openapi: 3.0.3
info:
  title: Novelize Internal API
  version: 1.0.0
  description: |
    Контракт взаємодії Web SPA з Content Service та Consistency Service через API Gateway (NGINX).
    Асинхронні операції повертають 202 Accepted; результат доставляється через WebSocket
    (Notification Service) та доступний через GET-ендпоінти.
    Трасування вимог: SRS-FUN-05, SRS-FUN-14, SRS-FUN-15, SRS-NFR-SEC-01..04.
servers:
  - url: https://novelize.local/api/v1
    description: Локальне розгортання Docker Compose
tags:
  - name: versions
    description: Версії текстових фрагментів (Content Service)
  - name: consistency
    description: Перевірка узгодженості твору (Consistency Service)
security:
  - bearerAuth: []
paths:
  /fragments/{fragmentId}/versions:
    post:
      tags: [versions]
      operationId: createFragmentVersion
      summary: Зберегти нову версію фрагмента
      description: |
        Створює text_versions із наступним version_no, ставить подію text.changed в outbox_events.
        Зберігаються останні 50 версій фрагмента. Аналіз тексту виконується асинхронно.
      parameters:
        - $ref: '#/components/parameters/FragmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Версію створено
          headers:
            Location:
              description: URI створеної версії
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /books/{bookId}/consistency-runs:
    post:
      tags: [consistency]
      operationId: createConsistencyRun
      summary: Запустити перевірку узгодженості книги
      description: |
        Створює consistency_runs зі статусом QUEUED. Перевірка виконується асинхронно
        (SRS-NFR-PERF-03: p95 не більше 3 с для 1000 вузлів і 5000 зв'язків).
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsistencyRunRequest'
      responses:
        '202':
          description: Перевірку прийнято до виконання
          headers:
            Location:
              description: URI ресурсу перевірки
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /books/{bookId}/consistency-runs/{runId}:
    get:
      tags: [consistency]
      operationId: getConsistencyRun
      summary: Отримати статус перевірки
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Стан перевірки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /books/{bookId}/consistency-runs/{runId}/findings:
    get:
      tags: [consistency]
      operationId: listConsistencyFindings
      summary: Отримати перелік виявлених суперечностей
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/RunId'
        - name: rule_code
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RuleCode'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Сторінка суперечностей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT (RS256), виданий Keycloak. Обов'язкові claims: sub, exp, iss, scope.
        Строк дії не більше 15 хв (SRS-NFR-SEC-01). Підпис перевіряє API Gateway.
  parameters:
    FragmentId:
      name: fragmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    RuleCode:
      type: string
      enum: [ATTRIBUTE_CONTRADICTION, TIMELINE_VIOLATION, LOCATION_CONFLICT]
    CreateVersionRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 50000
          description: Текст фрагмента, UTF-8
        base_version_no:
          type: integer
          minimum: 0
          description: Номер версії, на якій ґрунтується правка (для виявлення конфліктів)
    TextVersion:
      type: object
      required: [id, node_id, version_no, content_sha256, char_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        char_count:
          type: integer
          minimum: 1
          maximum: 50000
        created_at:
          type: string
          format: date-time
    CreateConsistencyRunRequest:
      type: object
      additionalProperties: false
      properties:
        rule_codes:
          type: array
          description: Підмножина правил; за відсутності виконуються всі
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RuleCode'
    ConsistencyRun:
      type: object
      required: [id, book_id, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        error_code:
          type: string
          maxLength: 64
          nullable: true
          enum: [GRAPH_UNAVAILABLE, TIMEOUT, null]
          description: Заповнено лише для статусу FAILED
        requested_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    Finding:
      type: object
      required: [id, run_id, rule_code, entity_ids, details, created_at]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        rule_code:
          $ref: '#/components/schemas/RuleCode'
        entity_ids:
          type: array
          description: Ідентифікатори вузлів графа Neo4j
          minItems: 1
          items:
            type: string
            format: uuid
        details:
          type: object
          additionalProperties: true
          description: Конфліктні значення та ідентифікатори подій
        created_at:
          type: string
          format: date-time
    FindingsPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    Problem:
      type: object
      description: Повідомлення про помилку за RFC 9457 (Problem Details)
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Помилка валідації вхідних даних
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: JWT відсутній, недійсний або прострочений
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Книга не належить автентифікованому користувачеві або недостатньо scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфлікт стану (застаріла base_version_no, перевірка вже виконується або ще не завершена)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Розмір content перевищує 50000 символів
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Перевищено ліміт запитів (100 запитів на хвилину на користувача)
      headers:
        Retry-After:
          description: Кількість секунд до повторного запиту
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутрішня помилка сервісу
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Сервіс або сховище тимчасово недоступні
      headers:
        Retry-After:
          description: Кількість секунд до повторного запиту
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
